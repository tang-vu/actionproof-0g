<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">ActionProof agent identity</title>
  <desc id="description">A graphite security seal with cyan and green proof layers.</desc>
  <defs>
    <radialGradient id="background" cx="30%" cy="18%" r="90%">
      <stop offset="0" stop-color="#132629"/>
      <stop offset="0.55" stop-color="#0b1113"/>
      <stop offset="1" stop-color="#070a0c"/>
    </radialGradient>
    <linearGradient id="seal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#62e7e1"/>
      <stop offset="1" stop-color="#7cf5a5"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="180" fill="url(#background)"/>
  <path d="M512 118 824 298v360L512 838 200 658V298Z" fill="none" stroke="#223438" stroke-width="3"/>
  <path d="M512 198 754 338v280L512 758 270 618V338Z" fill="#0d1517" stroke="url(#seal)" stroke-width="8" filter="url(#glow)"/>
  <path d="m392 510 79 79 169-181" fill="none" stroke="url(#seal)" stroke-linecap="round" stroke-linejoin="round" stroke-width="38"/>
  <circle cx="512" cy="478" r="178" fill="none" stroke="#244044" stroke-width="3" stroke-dasharray="8 18"/>
  <text x="512" y="900" fill="#dce9e6" font-family="Inter,Segoe UI,sans-serif" font-size="52" font-weight="650" text-anchor="middle" letter-spacing="-2">ACTIONPROOF</text>
</svg>
